<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuratePath - 人文書・社会科学の選書ロードマップ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React, ReactDOM, Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FBF9F5] text-stone-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const INITIAL_CATEGORIES = [
      "すべて", 
      "近代哲学", 
      "現代思想", 
      "社会学", 
      "言語学", 
      "政治哲学", 
      "経済学"
    ];

    const INITIAL_ROUTES = [
      {
        id: 1,
        category: "現代思想",
        title: "記号論と消費社会のリアリティを解読するルート",
        targetAudience: "現代カルチャーの背後にある記号作用や消費構造を理論的に把握したい人",
        author: "T. Nakamura",
        steps: [
          {
            step: 1,
            bookTitle: "消費社会の神話と構造",
            author: "ジャン・ボードリヤール",
            intent: "モノ自体の使用価値ではなく「差異の記号」を消費しているという現代社会の基本構造を掴むための必読原典。"
          },
          {
            step: 2,
            bookTitle: "動物化するポストモダン",
            author: "東浩紀",
            intent: "ボードリヤール的な記号消費モデルが、日本のオタクカルチャーやデータベース型情報環境でどう変容したかを接続して理解する。"
          }
        ]
      },
      {
        id: 2,
        category: "近代哲学",
        title: "主観と認識の限界をめぐる基礎ルート",
        targetAudience: "「私たちは世界をどう認識しているのか」という近代認識論の核心を掴みたい人",
        author: "哲学徒",
        steps: [
          {
            step: 1,
            bookTitle: "方法序説",
            author: "ルネ・デカルト",
            intent: "一切を疑った果てに確実な認識の足場（コギト）を見出す、近代哲学の出発点。"
          },
          {
            step: 2,
            bookTitle: "純粋理性批判",
            author: "イマヌエル・カント",
            intent: "デカルト的な主観を出発点としつつ、人間の理性・認識が届く限界と条件を厳密に画定する。"
          }
        ]
      }
    ];

    function App() {
      const [routes, setRoutes] = useState(INITIAL_ROUTES);
      const [selectedCategory, setSelectedCategory] = useState("すべて");
      const [currentRoute, setCurrentRoute] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const [newCategory, setNewCategory] = useState("近代哲学");
      const [newTitle, setNewTitle] = useState("");
      const [newTarget, setNewTarget] = useState("");
      const [newAuthor, setNewAuthor] = useState("");
      const [newSteps, setNewSteps] = useState([
        { step: 1, bookTitle: "", author: "", intent: "" },
        { step: 2, bookTitle: "", author: "", intent: "" }
      ]);

      const filteredRoutes = selectedCategory === "すべて" 
        ? routes 
        : routes.filter(r => r.category === selectedCategory);

      const handleStepChange = (idx, field, value) => {
        setNewSteps(prev => prev.map((s, i) => i === idx ? { ...s, [field]: value } : s));
      };

      const handleAddStep = () => {
        setNewSteps(prev => [
          ...prev, 
          { step: prev.length + 1, bookTitle: "", author: "", intent: "" }
        ]);
      };

      const handleRemoveStep = (idx) => {
        if (newSteps.length <= 1) return;
        const updated = newSteps.filter((_, i) => i !== idx).map((s, i) => ({ ...s, step: i + 1 }));
        setNewSteps(updated);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const validSteps = newSteps.filter(s => s.bookTitle.trim() !== "");
        if (validSteps.length === 0) return;

        const newEntry = {
          id: Date.now(),
          category: newCategory,
          title: newTitle,
          targetAudience: newTarget,
          author: newAuthor.trim() || "匿名キュレーター",
          steps: validSteps
        };

        setRoutes([newEntry, ...routes]);
        setIsModalOpen(false);
        setNewTitle("");
        setNewTarget("");
        setNewAuthor("");
        setNewSteps([
          { step: 1, bookTitle: "", author: "", intent: "" },
          { step: 2, bookTitle: "", author: "", intent: "" }
        ]);
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-10">
          {/* ヘッダー */}
          <header className="flex justify-between items-center mb-6 border-b border-stone-200 pb-4">
            <div>
              <h1 
                onClick={() => setCurrentRoute(null)}
                className="text-2xl font-bold tracking-tight text-stone-900 cursor-pointer hover:text-amber-950 transition font-serif"
              >
                CuratePath
              </h1>
              <p className="text-xs text-stone-500 mt-1">人文書・哲学の「読む順番と接続のロジック」を共有するプラットフォーム</p>
            </div>
            <button 
              onClick={() => setIsModalOpen(true)}
              className="bg-stone-900 hover:bg-stone-800 text-stone-50 text-xs font-semibold px-4 py-2 rounded-lg shadow-sm transition"
            >
              + ルートを投稿する
            </button>
          </header>

          {/* 共通の注記 */}
          <div className="mb-6 p-3 bg-stone-200/50 border border-stone-300/60 rounded-lg text-xs text-stone-600 leading-relaxed">
            <span className="font-semibold text-stone-800">💡 分野の分類について：</span>
            項目の分類は作成者の独断による大まかな目安です。投稿・閲覧の際は、ご自身のテーマに一番近いと感じるカテゴリを選んでお気軽にご利用ください。
          </div>

          {currentRoute ? (
            /* ルート詳細ビュー */
            <div>
              <button 
                onClick={() => setCurrentRoute(null)}
                className="inline-flex items-center text-xs font-semibold text-stone-600 hover:text-stone-900 mb-6 bg-stone-200/70 hover:bg-stone-200 px-3 py-1.5 rounded transition"
              >
                ← 一覧に戻る
              </button>

              <div className="bg-white border border-stone-200 rounded-xl p-6 mb-8 shadow-sm">
                <span className="text-xs font-bold px-2.5 py-1 rounded bg-amber-100 text-amber-900 border border-amber-200/60">
                  {currentRoute.category}
                </span>
                <h2 className="text-xl font-bold text-stone-900 mt-3 font-serif">{currentRoute.title}</h2>
                <div className="mt-4 pt-4 border-t border-stone-100 flex flex-wrap justify-between text-xs text-stone-600 gap-2">
                  <div><span className="font-semibold text-stone-800">対象読者・関心:</span> {currentRoute.targetAudience}</div>
                  <div><span className="font-semibold text-stone-800">作成者:</span> {currentRoute.author}</div>
                </div>
              </div>

              <div className="space-y-6">
                <h3 className="text-xs font-bold text-stone-400 uppercase tracking-widest px-1">
                  選書ロードマップ（全 {currentRoute.steps.length} 冊）
                </h3>

                {currentRoute.steps.map((item, index) => (
                  <div key={index} className="relative">
                    {index < currentRoute.steps.length - 1 && (
                      <div className="absolute left-6 top-16 bottom-0 w-0.5 bg-stone-300 -mb-6 z-0"></div>
                    )}

                    <div className="relative z-10 bg-white border border-stone-200/90 rounded-xl p-6 shadow-sm hover:shadow transition">
                      <div className="flex items-start gap-4">
                        <div className="w-8 h-8 rounded-full bg-stone-900 text-stone-50 flex items-center justify-center font-bold text-sm shrink-0 shadow-sm">
                          {item.step}
                        </div>

                        <div className="flex-1 min-w-0">
                          <div className="flex flex-wrap items-baseline gap-2">
                            <h4 className="text-base font-bold text-stone-900 font-serif leading-snug">{item.bookTitle}</h4>
                            {item.author && <span className="text-xs text-stone-500">（著: {item.author}）</span>}
                          </div>

                          <div className="mt-3 bg-[#FBF9F5] p-3.5 rounded-lg border border-stone-200/70 text-xs sm:text-sm text-stone-700 leading-relaxed">
                            <span className="text-xs font-bold text-amber-900 block mb-1">【この順番にした意図・接続の理由】</span>
                            {item.intent}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            /* ルート一覧ビュー */
            <div>
              {/* カテゴリ切り替えタブ */}
              <div className="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-stone-200">
                {INITIAL_CATEGORIES.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${
                      selectedCategory === cat 
                        ? "bg-stone-900 text-stone-50 shadow-sm" 
                        : "bg-white text-stone-600 border border-stone-200/80 hover:bg-stone-100"
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {/* カード一覧 */}
              <div className="space-y-4">
                {filteredRoutes.map(route => (
                  <div 
                    key={route.id}
                    onClick={() => setCurrentRoute(route)}
                    className="bg-white hover:border-stone-300 border border-stone-200 p-5 rounded-xl shadow-sm hover:shadow transition cursor-pointer"
                  >
                    <div className="flex justify-between items-start gap-4">
                      <div>
                        <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-amber-50 text-amber-900 border border-amber-200/60">
                          {route.category}
                        </span>
                        <h2 className="text-base font-bold text-stone-900 mt-2 hover:text-amber-950 transition font-serif">
                          {route.title}
                        </h2>
                        <p className="text-xs text-stone-500 mt-1">関心・ゴール: {route.targetAudience}</p>
                      </div>
                      <div className="text-right shrink-0">
                        <span className="text-[11px] text-stone-400 block">{route.author}</span>
                        <span className="text-xs font-bold text-stone-700 bg-stone-100 px-2.5 py-1 rounded-md border border-stone-200 inline-block mt-2">
                          {route.steps.length} 冊ルート →
                        </span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* 投稿用モーダル */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-xl border border-stone-200">
                <div className="flex justify-between items-center border-b border-stone-200 pb-3">
                  <h3 className="font-bold text-base text-stone-900 font-serif">選書ルートの投稿</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-stone-400 hover:text-stone-600 text-lg">✕</button>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-stone-700 mb-1">分野（最も近いもの）</label>
                      <select 
                        value={newCategory} 
                        onChange={(e) => setNewCategory(e.target.value)}
                        className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs bg-white text-stone-800"
                      >
                        {INITIAL_CATEGORIES.filter(c => c !== "すべて").map(c => (
                          <option key={c} value={c}>{c}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-stone-700 mb-1">投稿者名</label>
                      <input 
                        type="text" 
                        placeholder="例: 名無しの読書子" 
                        value={newAuthor}
                        onChange={(e) => setNewAuthor(e.target.value)}
                        className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs text-stone-800"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-stone-700 mb-1">ルートのタイトル</label>
                    <input 
                      type="text" 
                      required
                      placeholder="例: 主観と認識の限界をめぐる基礎ルート" 
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs text-stone-800"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-stone-700 mb-1">想定読者・関心・ゴール</label>
                    <input 
                      type="text" 
                      required
                      placeholder="例: 現代思想を原典から読む前に、近代認識論の骨格を掴んでおきたい人" 
                      value={newTarget}
                      onChange={(e) => setNewTarget(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs text-stone-800"
                    />
                  </div>

                  <div className="space-y-4 pt-2">
                    <label className="block text-xs font-bold text-stone-900 uppercase">読む順番と意図</label>
                    {newSteps.map((step, idx) => (
                      <div key={idx} className="p-4 bg-[#FBF9F5] border border-stone-200 rounded-lg space-y-3 relative">
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-xs text-amber-900">Step {step.step}</span>
                          {newSteps.length > 1 && (
                            <button 
                              type="button" 
                              onClick={() => handleRemoveStep(idx)}
                              className="text-[11px] text-red-500 hover:text-red-700"
                            >
                              削除
                            </button>
                          )}
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="block text-[11px] text-stone-600 mb-0.5">本のタイトル *</label>
                            <input 
                              type="text" 
                              required
                              placeholder="例: 方法序説" 
                              value={step.bookTitle}
                              onChange={(e) => handleStepChange(idx, "bookTitle", e.target.value)}
                              className="w-full border border-stone-300 rounded-md px-2.5 py-1.5 text-xs bg-white text-stone-800"
                            />
                          </div>
                          <div>
                            <label className="block text-[11px] text-stone-600 mb-0.5">著者名</label>
                            <input 
                              type="text" 
                              placeholder="例: ルネ・デカルト" 
                              value={step.author}
                              onChange={(e) => handleStepChange(idx, "author", e.target.value)}
                              className="w-full border border-stone-300 rounded-md px-2.5 py-1.5 text-xs bg-white text-stone-800"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-[11px] text-stone-600 mb-0.5">なぜこの順番なのか？（接続の理由） *</label>
                          <textarea 
                            rows="2"
                            required
                            placeholder="例: 1冊目の「我思う、ゆえに我あり」という主観の出発点を踏まえ、理性の限界を規定する2冊目へ接続するため。"
                            value={step.intent}
                            onChange={(e) => handleStepChange(idx, "intent", e.target.value)}
                            className="w-full border border-stone-300 rounded-md px-2.5 py-1.5 text-xs bg-white text-stone-800"
                          />
                        </div>
                      </div>
                    ))}

                    <button 
                      type="button" 
                      onClick={handleAddStep}
                      className="text-xs text-stone-700 hover:text-stone-900 font-semibold"
                    >
                      + 次のステップ（本）を追加する
                    </button>
                  </div>

                  <div className="flex justify-end gap-2 pt-4 border-t border-stone-200">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 border border-stone-300 rounded-lg text-xs text-stone-600 hover:bg-stone-50"
                    >
                      キャンセル
                    </button>
                    <button 
                      type="submit"
                      className="px-4 py-2 bg-stone-900 text-stone-50 rounded-lg text-xs font-semibold hover:bg-stone-800 shadow-sm"
                    >
                      ルートを投稿する
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
