<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuratePath - 人文書・哲学の選書ロードマップ & コレクション</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#FBF9F5] text-stone-900 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = "https://ykhspdfbugrjglcdpgwg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_YdrPWwCW_bZ7MrgLzz4kyg_k0wIxEHE";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const INITIAL_CATEGORIES = [
      "すべて", 
      "近代哲学", 
      "現代思想", 
      "社会学", 
      "言語学", 
      "政治哲学", 
      "経済学"
    ];

    const STORAGE_KEY = "curatepath_my_route_ids";
    const getMyRouteIds = () => {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    };
    const saveMyRouteId = (id) => {
      const ids = getMyRouteIds();
      if (!ids.includes(id)) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...ids, id]));
      }
    };
    const removeMyRouteId = (id) => {
      const ids = getMyRouteIds();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(ids.filter(item => item !== id)));
    };

    function App() {
      const [routes, setRoutes] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [selectedCategory, setSelectedCategory] = useState("すべて");
      const [currentRoute, setCurrentRoute] = useState(null);
      const [myRouteIds, setMyRouteIds] = useState([]);
      
      // モーダル & ステップ管理
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isEditMode, setIsEditMode] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [wizardStep, setWizardStep] = useState(0);
      const [currentBookIndex, setCurrentBookIndex] = useState(0);

      // フォーム入力値
      const [formatType, setFormatType] = useState("parallel"); 
      const [newCategory, setNewCategory] = useState("近代哲学");
      const [newTitle, setNewTitle] = useState("");
      const [newTarget, setNewTarget] = useState("");
      const [newAuthor, setNewAuthor] = useState("");
      const [newSteps, setNewSteps] = useState([
        { step: 1, bookTitle: "", author: "", intent: "" }
      ]);

      const fetchRoutes = async () => {
        setIsLoading(true);
        try {
          const { data, error } = await supabaseClient
            .from('routes')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) throw error;
          setRoutes(data || []);
        } catch (err) {
          console.error("データ取得エラー:", err.message);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchRoutes();
        setMyRouteIds(getMyRouteIds());
      }, []);

      const filteredRoutes = selectedCategory === "すべて" 
        ? routes 
        : routes.filter(r => r.category === selectedCategory);

      const getRouteData = (route) => {
        if (!route || !route.steps) return { type: "parallel", items: [] };
        if (Array.isArray(route.steps)) {
          const type = route.steps[0]?._formatType || "sequence";
          return { type, items: route.steps };
        }
        return { type: route.steps.formatType || "parallel", items: route.steps.items || [] };
      };

      const handleStepChange = (idx, field, value) => {
        setNewSteps(prev => prev.map((s, i) => i === idx ? { ...s, [field]: value } : s));
      };

      const handleOpenCreate = () => {
        setIsEditMode(false);
        setEditingId(null);
        setWizardStep(0);
        setCurrentBookIndex(0);
        setFormatType("parallel");
        setNewCategory("近代哲学");
        setNewTitle("");
        setNewTarget("");
        setNewAuthor("");
        setNewSteps([
          { step: 1, bookTitle: "", author: "", intent: "" }
        ]);
        setIsModalOpen(true);
      };

      const handleStartEdit = (route) => {
        const routeData = getRouteData(route);
        setIsEditMode(true);
        setEditingId(route.id);
        setWizardStep(0);
        setCurrentBookIndex(0);
        setFormatType(routeData.type);
        setNewCategory(route.category || "近代哲学");
        setNewTitle(route.title || "");
        setNewTarget(route.target_audience || "");
        setNewAuthor(route.author || "");
        setNewSteps(routeData.items.length > 0 ? routeData.items : [
          { step: 1, bookTitle: "", author: "", intent: "" }
        ]);
        setIsModalOpen(true);
      };

      const handleDelete = async (route) => {
        if (!window.confirm(`「${route.title}」を本当に削除しますか？`)) return;

        try {
          const { error } = await supabaseClient
            .from('routes')
            .delete()
            .eq('id', route.id);

          if (error) throw error;

          removeMyRouteId(route.id);
          setMyRouteIds(getMyRouteIds());
          setRoutes(prev => prev.filter(r => r.id !== route.id));
          if (currentRoute && currentRoute.id === route.id) {
            setCurrentRoute(null);
          }
          alert("削除が完了しました。");
        } catch (err) {
          alert("削除に失敗しました: " + err.message);
        }
      };

      const handleNextBook = () => {
        const current = newSteps[currentBookIndex];
        if (!current || !current.bookTitle.trim()) {
          alert("本のタイトルを入力してください。");
          return;
        }

        if (currentBookIndex + 1 < newSteps.length) {
          setCurrentBookIndex(currentBookIndex + 1);
        } else {
          setNewSteps([
            ...newSteps,
            { step: newSteps.length + 1, bookTitle: "", author: "", intent: "" }
          ]);
          setCurrentBookIndex(newSteps.length);
        }
      };

      const handlePrevBook = () => {
        if (currentBookIndex > 0) {
          setCurrentBookIndex(currentBookIndex - 1);
        } else {
          setWizardStep(0);
        }
      };

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        const validSteps = newSteps.filter(s => s.bookTitle.trim() !== "");
        if (validSteps.length === 0) {
          alert("少なくとも1冊は本の情報を入力してください。");
          return;
        }

        const stepsWithFormat = validSteps.map((s) => ({
          ...s,
          _formatType: formatType
        }));

        setIsSubmitting(true);
        try {
          const entryData = {
            category: newCategory,
            title: newTitle.trim() || "無題の選書",
            target_audience: newTarget.trim(),
            author: newAuthor.trim() || "匿名キュレーター",
            steps: stepsWithFormat
          };

          if (isEditMode) {
            const { data, error } = await supabaseClient
              .from('routes')
              .update(entryData)
              .eq('id', editingId)
              .select();

            if (error) throw error;

            if (data && data.length > 0) {
              const updated = data[0];
              setRoutes(prev => prev.map(r => r.id === editingId ? updated : r));
              if (currentRoute && currentRoute.id === editingId) {
                setCurrentRoute(updated);
              }
            }
            alert("更新しました！");
          } else {
            const { data, error } = await supabaseClient
              .from('routes')
              .insert([entryData])
              .select();

            if (error) throw error;

            if (data && data.length > 0) {
              const created = data[0];
              saveMyRouteId(created.id);
              setMyRouteIds(getMyRouteIds());
              setRoutes([created, ...routes]);
            }
            alert("投稿しました！");
          }

          setIsModalOpen(false);
        } catch (err) {
          alert("保存に失敗しました: " + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-10">
          {/* ヘッダー */}
          <header className="flex justify-between items-center mb-6 border-b border-stone-200 pb-4">
            <div>
              <h1 
                onClick={() => setCurrentRoute(null)}
                className="text-2xl font-bold tracking-tight text-stone-900 cursor-pointer hover:text-amber-950 transition font-serif"
              >
                CuratePath
              </h1>
              <p className="text-xs text-stone-600 mt-1 font-medium">自分のおすすめの本をコメント付きで投稿して、初学者の道を照らそう！</p>
            </div>
            <button 
              onClick={handleOpenCreate}
              className="bg-stone-900 hover:bg-stone-800 text-stone-50 text-xs font-semibold px-4 py-2 rounded-lg shadow-sm transition"
            >
              + 選書を投稿する
            </button>
          </header>

          {/* 💡 ガイド案内ボックス */}
          <div className="mb-6 p-4 bg-white border border-stone-300 rounded-xl text-xs text-stone-900 space-y-2.5 leading-relaxed shadow-sm">
            <div className="flex items-start gap-2">
              <span className="font-bold text-stone-950 shrink-0">📖 投稿スタイルについて：</span>
              <span className="text-stone-900">
                「現代思想のおすすめ3選」のような<strong>まとまりのある選書リスト（並列）</strong>はもちろん、<strong>「読む順番（順序ルート）」</strong>としても自由に投稿できます。
              </span>
            </div>
            <div className="flex items-start gap-2 pt-2 border-t border-stone-100">
              <span className="font-bold text-stone-950 shrink-0">⚙️ 編集・削除について：</span>
              <span className="text-stone-900">
                ログインやパスワードは不要です。<strong>投稿した端末（ブラウザ）からアクセスすると、自動的に「✎ 編集」「🗑 削除」ボタンが表示されます。</strong>
              </span>
            </div>
            <div className="flex items-start gap-2 pt-2 border-t border-stone-100 text-stone-800 text-[11px] font-medium">
              <span>※ 分野の分類に気を遣う必要はあまりありません。一番近いと感じるカテゴリをお気軽にお選びください。</span>
            </div>
          </div>

          {currentRoute ? (
            /* 詳細ビュー */
            (() => {
              const currentData = getRouteData(currentRoute);
              const isSequence = currentData.type === "sequence";

              return (
                <div>
                  <div className="flex justify-between items-center mb-6">
                    <button 
                      onClick={() => setCurrentRoute(null)}
                      className="inline-flex items-center text-xs font-semibold text-stone-700 hover:text-stone-950 bg-stone-200/80 hover:bg-stone-200 px-3 py-1.5 rounded transition"
                    >
                      ← 一覧に戻る
                    </button>

                    {myRouteIds.includes(currentRoute.id) && (
                      <div className="flex gap-2">
                        <button 
                          onClick={() => handleStartEdit(currentRoute)}
                          className="text-xs font-semibold text-stone-800 bg-white border border-stone-300 hover:bg-stone-50 px-3 py-1.5 rounded-lg shadow-sm transition"
                        >
                          ✎ 編集する
                        </button>
                        <button 
                          onClick={() => handleDelete(currentRoute)}
                          className="text-xs font-semibold text-red-600 bg-white border border-red-200 hover:bg-red-50 px-3 py-1.5 rounded-lg shadow-sm transition"
                        >
                          🗑 削除
                        </button>
                      </div>
                    )}
                  </div>

                  <div className="bg-white border border-stone-200 rounded-xl p-6 mb-8 shadow-sm">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold px-2.5 py-1 rounded bg-amber-100 text-amber-950 border border-amber-200/60">
                        {currentRoute.category}
                      </span>
                      <span className="text-xs font-medium px-2 py-0.5 rounded bg-stone-100 text-stone-700 border border-stone-200">
                        {isSequence ? "順序ルート" : "並列リスト"}
                      </span>
                    </div>
                    <h2 className="text-xl font-bold text-stone-900 mt-3 font-serif">{currentRoute.title}</h2>
                    <div className="mt-4 pt-4 border-t border-stone-100 flex flex-wrap justify-between text-xs text-stone-700 gap-2">
                      <div><span className="font-semibold text-stone-900">対象読者・テーマ:</span> {currentRoute.target_audience}</div>
                      <div><span className="font-semibold text-stone-900">キュレーター:</span> {currentRoute.author}</div>
                    </div>
                  </div>

                  <div className="space-y-6">
                    <h3 className="text-xs font-bold text-stone-500 uppercase tracking-widest px-1">
                      {isSequence ? `選書ロードマップ（全 ${currentData.items.length} 冊）` : `おすすめ選書リスト（全 ${currentData.items.length} 冊）`}
                    </h3>

                    {currentData.items.map((item, index) => (
                      <div key={index} className="relative">
                        {isSequence && index < currentData.items.length - 1 && (
                          <div className="absolute left-6 top-16 bottom-0 w-0.5 bg-stone-300 -mb-6 z-0"></div>
                        )}

                        <div className="relative z-10 bg-white border border-stone-200/90 rounded-xl p-6 shadow-sm hover:shadow transition">
                          <div className="flex items-start gap-4">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0 shadow-sm ${
                              isSequence ? "bg-stone-900 text-stone-50" : "bg-amber-100 text-amber-950 border border-amber-300"
                            }`}>
                              {isSequence ? item.step : index + 1}
                            </div>

                            <div className="flex-1 min-w-0">
                              <div className="flex flex-wrap items-baseline gap-2">
                                <h4 className="text-base font-bold text-stone-900 font-serif leading-snug">{item.bookTitle}</h4>
                                {item.author && <span className="text-xs text-stone-600">（著: {item.author}）</span>}
                              </div>

                              <div className="mt-3 bg-[#FBF9F5] p-4 rounded-lg border border-stone-200 text-sm text-stone-900 leading-relaxed whitespace-pre-wrap">
                                <span className="text-xs font-bold text-amber-950 block mb-1.5">
                                  {isSequence ? "【この順番にした意図・接続の理由】" : "【おすすめの理由・見どころ】"}
                                </span>
                                {item.intent}
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()
          ) : (
            /* 一覧ビュー */
            <div>
              <div className="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-stone-200">
                {INITIAL_CATEGORIES.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${
                      selectedCategory === cat 
                        ? "bg-stone-900 text-stone-50 shadow-sm" 
                        : "bg-white text-stone-700 border border-stone-200/80 hover:bg-stone-100"
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {isLoading ? (
                <div className="text-center py-12 text-xs text-stone-500">クラウドからデータを読み込み中...</div>
              ) : filteredRoutes.length === 0 ? (
                <div className="text-center py-12 text-xs text-stone-500 bg-white border border-stone-200 rounded-xl">
                  まだ選書が投稿されていません。「+ 選書を投稿する」から最初の選書を投稿してみましょう！
                </div>
              ) : (
                <div className="space-y-4">
                  {filteredRoutes.map(route => {
                    const routeData = getRouteData(route);
                    const isSequence = routeData.type === "sequence";

                    return (
                      <div 
                        key={route.id}
                        onClick={() => setCurrentRoute(route)}
                        className="bg-white hover:border-stone-300 border border-stone-200 p-5 rounded-xl shadow-sm hover:shadow transition cursor-pointer"
                      >
                        <div className="flex justify-between items-start gap-4">
                          <div>
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-amber-50 text-amber-950 border border-amber-200/60">
                                {route.category}
                              </span>
                              <span className="text-[10px] text-stone-600 bg-stone-100 px-1.5 py-0.5 rounded border border-stone-200">
                                {isSequence ? "順序ルート" : "並列リスト"}
                              </span>
                              {myRouteIds.includes(route.id) && (
                                <span className="text-[10px] bg-stone-900 text-stone-100 px-1.5 py-0.5 rounded font-medium">
                                  あなたの投稿
                                </span>
                              )}
                            </div>
                            <h2 className="text-base font-bold text-stone-900 mt-2 hover:text-amber-950 transition font-serif">
                              {route.title}
                            </h2>
                            <p className="text-xs text-stone-600 mt-1">テーマ・関心: {route.target_audience}</p>
                          </div>
                          <div className="text-right shrink-0">
                            <span className="text-[11px] text-stone-500 block">{route.author}</span>
                            <span className="text-xs font-bold text-stone-800 bg-stone-100 px-2.5 py-1 rounded-md border border-stone-200 inline-block mt-2">
                              {routeData.items.length} 冊 {isSequence ? "ルート →" : "リスト →"}
                            </span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* 🌟 画面中央のステップ式投稿モーダル（縦長に上下拡張 & コメント欄最大化） */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-3 sm:p-4 z-50">
              <div className="bg-white rounded-2xl max-w-lg w-full h-[85vh] min-h-[580px] max-h-[760px] p-5 sm:p-7 shadow-2xl border border-stone-200 flex flex-col justify-between transition-all">
                
                {/* ヘッダー（固定） */}
                <div className="flex justify-between items-center border-b border-stone-100 pb-3 shrink-0">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold px-2.5 py-1 rounded bg-stone-900 text-stone-50 shadow-sm">
                      {wizardStep === 0 ? "Step 1/2: 基本設定" : `Step 2/2: 本の入力 (${currentBookIndex + 1}/${newSteps.length}冊目)`}
                    </span>
                    <h3 className="font-bold text-base text-stone-900 font-serif">
                      {isEditMode ? "選書を編集" : "選書を投稿"}
                    </h3>
                  </div>
                  <button 
                    onClick={() => setIsModalOpen(false)} 
                    className="text-stone-400 hover:text-stone-700 text-xl font-semibold p-1"
                  >
                    ✕
                  </button>
                </div>

                {/* 画面1：基本設定（分野 ＆ 並列/ルートの選択） */}
                {wizardStep === 0 && (
                  <div className="flex-1 flex flex-col justify-between py-2 space-y-3 overflow-y-auto">
                    <div className="space-y-4">
                      {/* 分野選択 */}
                      <div className="p-3.5 bg-stone-100/80 rounded-xl border border-stone-300">
                        <div className="flex items-center justify-between mb-2">
                          <label className="text-xs font-black text-stone-950 flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-full bg-stone-900 inline-block"></span>
                            1. 分野を選択してください（必須）
                          </label>
                          <span className="text-[10px] font-bold bg-stone-900 text-stone-50 px-2 py-0.5 rounded">選択必須</span>
                        </div>
                        <select 
                          value={newCategory} 
                          onChange={(e) => setNewCategory(e.target.value)}
                          className="w-full border-2 border-stone-900 rounded-lg px-3.5 py-2 text-sm font-bold bg-white text-stone-950 shadow-sm focus:outline-none focus:ring-2 focus:ring-stone-900"
                        >
                          {INITIAL_CATEGORIES.filter(c => c !== "すべて").map(c => (
                            <option key={c} value={c} className="font-medium text-stone-900">{c}</option>
                          ))}
                        </select>
                      </div>

                      {/* スタイル選択 */}
                      <div>
                        <label className="block text-xs font-bold text-stone-900 mb-1.5">
                          2. 投稿スタイルを選択
                        </label>
                        <div className="grid grid-cols-2 gap-2.5">
                          <button
                            type="button"
                            onClick={() => setFormatType("parallel")}
                            className={`p-3 rounded-xl border-2 text-left transition ${
                              formatType === "parallel"
                                ? "border-stone-900 bg-stone-900 text-white shadow-sm"
                                : "border-stone-200 bg-stone-50 text-stone-700 hover:bg-stone-100"
                            }`}
                          >
                            <div className="font-bold text-xs">並列リスト形式</div>
                            <div className={`text-[10px] mt-0.5 ${formatType === "parallel" ? "text-stone-300" : "text-stone-500"}`}>
                              おすすめ本・テーマ別
                            </div>
                          </button>

                          <button
                            type="button"
                            onClick={() => setFormatType("sequence")}
                            className={`p-3 rounded-xl border-2 text-left transition ${
                              formatType === "sequence"
                                ? "border-stone-900 bg-stone-900 text-white shadow-sm"
                                : "border-stone-200 bg-stone-50 text-stone-700 hover:bg-stone-100"
                            }`}
                          >
                            <div className="font-bold text-xs">順序ルート形式</div>
                            <div className={`text-[10px] mt-0.5 ${formatType === "sequence" ? "text-stone-300" : "text-stone-500"}`}>
                              読む順番（Step 1, 2...）
                            </div>
                          </button>
                        </div>
                      </div>

                      {/* タイトルと想定読者 */}
                      <div className="pt-2 border-t border-stone-100 space-y-3">
                        <div>
                          <label className="block text-xs font-bold text-stone-900 mb-1">
                            リスト / ルートのタイトル *
                          </label>
                          <input 
                            type="text" 
                            required
                            placeholder={formatType === "parallel" ? "例: 現代思想を始めるためのおすすめ3選" : "例: 主観と認識の限界をめぐる基礎ルート"} 
                            value={newTitle}
                            onChange={(e) => setNewTitle(e.target.value)}
                            className="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm text-stone-900 focus:outline-none focus:border-stone-900 font-medium"
                          />
                        </div>

                        <div className="grid grid-cols-2 gap-2.5">
                          <div>
                            <label className="block text-xs font-bold text-stone-900 mb-1">テーマ・関心・対象</label>
                            <input 
                              type="text" 
                              placeholder="例: 初心者向け、構造主義" 
                              value={newTarget}
                              onChange={(e) => setNewTarget(e.target.value)}
                              className="w-full border border-stone-300 rounded-xl px-3 py-2 text-xs text-stone-900"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-stone-900 mb-1">キュレーター名</label>
                            <input 
                              type="text" 
                              placeholder="例: 名無しの読書子" 
                              value={newAuthor}
                              onChange={(e) => setNewAuthor(e.target.value)}
                              className="w-full border border-stone-300 rounded-xl px-3 py-2 text-xs text-stone-900"
                            />
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="flex justify-end gap-2 pt-3 border-t border-stone-100 shrink-0">
                      <button 
                        type="button" 
                        onClick={() => setIsModalOpen(false)}
                        className="px-4 py-2 border border-stone-300 rounded-xl text-xs font-semibold text-stone-700 hover:bg-stone-50"
                      >
                        キャンセル
                      </button>
                      <button 
                        type="button"
                        onClick={() => {
                          if (!newTitle.trim()) {
                            alert("タイトルを入力してください。");
                            return;
                          }
                          setWizardStep(1);
                        }}
                        className="px-5 py-2 bg-stone-900 text-stone-50 rounded-xl text-xs font-bold hover:bg-stone-800 shadow-md transition"
                      >
                        本の入力へ進む →
                      </button>
                    </div>
                  </div>
                )}

                {/* 画面2：本の入力（上下拡張＆コメント欄を最大限に拡大） */}
                {wizardStep === 1 && (
                  <div className="flex-1 flex flex-col justify-between py-2 space-y-3">
                    <div className="flex-1 flex flex-col space-y-3">
                      <div className="grid grid-cols-2 gap-2.5 shrink-0">
                        <div>
                          <label className="block text-xs font-bold text-stone-900 mb-1">本のタイトル *</label>
                          <input 
                            type="text" 
                            required
                            placeholder="例: 方法序説" 
                            value={newSteps[currentBookIndex]?.bookTitle || ""}
                            onChange={(e) => handleStepChange(currentBookIndex, "bookTitle", e.target.value)}
                            className="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm text-stone-900 font-medium focus:outline-none focus:border-stone-900"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-stone-900 mb-1">著者名</label>
                          <input 
                            type="text" 
                            placeholder="例: ルネ・デカルト" 
                            value={newSteps[currentBookIndex]?.author || ""}
                            onChange={(e) => handleStepChange(currentBookIndex, "author", e.target.value)}
                            className="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm text-stone-900"
                          />
                        </div>
                      </div>

                      {/* コメント欄（flex-1 で余った縦幅をすべて使って最大化） */}
                      <div className="flex-1 flex flex-col min-h-0">
                        <div className="flex justify-between items-center mb-1 shrink-0">
                          <label className="text-xs font-bold text-stone-900">
                            {formatType === "parallel" ? "おすすめの理由・見どころ（コメント） *" : "なぜこの順番なのか？（接続の理由） *"}
                          </label>
                          <span className="text-[10px] text-stone-500 font-medium">広々と入力できます</span>
                        </div>
                        <textarea 
                          required
                          placeholder={formatType === "parallel" 
                            ? "例: 現代思想を学ぶ上で最も切れ味鋭い入門書。デリダやドゥルーズに入る前の足がかりとして最適です。特に第2章の解説が明快で、初学者がつまずきやすい概念を鮮やかに整理してくれます。" 
                            : "例: 1冊目の主観の出発点を踏まえ、理性の限界を規定する2冊目へスムーズに接続するため。この本で提示された疑問が次のステップで深められます。"}
                          value={newSteps[currentBookIndex]?.intent || ""}
                          onChange={(e) => handleStepChange(currentBookIndex, "intent", e.target.value)}
                          className="w-full flex-1 min-h-[240px] sm:min-h-[280px] border border-stone-300 rounded-xl p-3.5 text-xs sm:text-sm text-stone-900 leading-relaxed focus:outline-none focus:border-stone-900 resize-none font-normal"
                        />
                      </div>
                    </div>

                    <div className="flex justify-between items-center pt-3 border-t border-stone-100 shrink-0">
                      <button 
                        type="button" 
                        onClick={handlePrevBook}
                        className="px-4 py-2 border border-stone-300 rounded-xl text-xs font-semibold text-stone-700 hover:bg-stone-50"
                      >
                        ← 前へ
                      </button>

                      <div className="flex gap-2">
                        <button 
                          type="button" 
                          onClick={handleNextBook}
                          className="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-900 border border-stone-300 rounded-xl text-xs font-bold transition"
                        >
                          + 次の本を追加
                        </button>
                        <button 
                          type="button"
                          disabled={isSubmitting}
                          onClick={() => handleSubmit()}
                          className="px-5 py-2 bg-stone-900 text-stone-50 rounded-xl text-xs font-bold hover:bg-stone-800 shadow-md disabled:opacity-50 transition"
                        >
                          {isSubmitting ? "保存中..." : isEditMode ? "変更を保存する" : "投稿を完了する"}
                        </button>
                      </div>
                    </div>
                  </div>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
