<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuratePath - 人文書・哲学の選書ロードマップ & コレクション</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#FBF9F5] text-stone-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = "https://ykhspdfbugrjglcdpgwg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_YdrPWwCW_bZ7MrgLzz4kyg_k0wIxEHE";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const INITIAL_CATEGORIES = [
      "すべて", 
      "近代哲学", 
      "現代思想", 
      "社会学", 
      "言語学", 
      "政治哲学", 
      "経済学"
    ];

    // ローカルストレージ管理
    const STORAGE_KEY = "curatepath_my_route_ids";
    const getMyRouteIds = () => {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    };
    const saveMyRouteId = (id) => {
      const ids = getMyRouteIds();
      if (!ids.includes(id)) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...ids, id]));
      }
    };
    const removeMyRouteId = (id) => {
      const ids = getMyRouteIds();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(ids.filter(item => item !== id)));
    };

    function App() {
      const [routes, setRoutes] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [selectedCategory, setSelectedCategory] = useState("すべて");
      const [currentRoute, setCurrentRoute] = useState(null);
      const [myRouteIds, setMyRouteIds] = useState([]);
      
      // 投稿・編集モーダルの状態
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isEditMode, setIsEditMode] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);

      // フォーム入力値（デフォルトを parallel に変更）
      const [formatType, setFormatType] = useState("parallel"); 
      const [newCategory, setNewCategory] = useState("近代哲学");
      const [newTitle, setNewTitle] = useState("");
      const [newTarget, setNewTarget] = useState("");
      const [newAuthor, setNewAuthor] = useState("");
      const [newSteps, setNewSteps] = useState([
        { step: 1, bookTitle: "", author: "", intent: "" },
        { step: 2, bookTitle: "", author: "", intent: "" }
      ]);

      const fetchRoutes = async () => {
        setIsLoading(true);
        try {
          const { data, error } = await supabaseClient
            .from('routes')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) throw error;
          setRoutes(data || []);
        } catch (err) {
          console.error("データ取得エラー:", err.message);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchRoutes();
        setMyRouteIds(getMyRouteIds());
      }, []);

      const filteredRoutes = selectedCategory === "すべて" 
        ? routes 
        : routes.filter(r => r.category === selectedCategory);

      // データ構造の解析
      const getRouteData = (route) => {
        if (!route || !route.steps) return { type: "parallel", items: [] };
        if (Array.isArray(route.steps)) {
          const type = route.steps[0]?._formatType || "sequence";
          return { type, items: route.steps };
        }
        return { type: route.steps.formatType || "parallel", items: route.steps.items || [] };
      };

      const handleStepChange = (idx, field, value) => {
        setNewSteps(prev => prev.map((s, i) => i === idx ? { ...s, [field]: value } : s));
      };

      const handleAddStep = () => {
        setNewSteps(prev => [
          ...prev, 
          { step: prev.length + 1, bookTitle: "", author: "", intent: "" }
        ]);
      };

      const handleRemoveStep = (idx) => {
        if (newSteps.length <= 1) return;
        const updated = newSteps.filter((_, i) => i !== idx).map((s, i) => ({ ...s, step: i + 1 }));
        setNewSteps(updated);
      };

      // 新規作成モーダルを開く（デフォルトは並列リスト）
      const handleOpenCreate = () => {
        setIsEditMode(false);
        setEditingId(null);
        setFormatType("parallel");
        setNewCategory("近代哲学");
        setNewTitle("");
        setNewTarget("");
        setNewAuthor("");
        setNewSteps([
          { step: 1, bookTitle: "", author: "", intent: "" },
          { step: 2, bookTitle: "", author: "", intent: "" }
        ]);
        setIsModalOpen(true);
      };

      // 編集モーダルを開く
      const handleStartEdit = (route) => {
        const routeData = getRouteData(route);
        setIsEditMode(true);
        setEditingId(route.id);
        setFormatType(routeData.type);
        setNewCategory(route.category || "近代哲学");
        setNewTitle(route.title || "");
        setNewTarget(route.target_audience || "");
        setNewAuthor(route.author || "");
        setNewSteps(routeData.items.length > 0 ? routeData.items : [
          { step: 1, bookTitle: "", author: "", intent: "" }
        ]);
        setIsModalOpen(true);
      };

      // 削除処理
      const handleDelete = async (route) => {
        if (!window.confirm(`「${route.title}」を本当に削除しますか？`)) return;

        try {
          const { error } = await supabaseClient
            .from('routes')
            .delete()
            .eq('id', route.id);

          if (error) throw error;

          removeMyRouteId(route.id);
          setMyRouteIds(getMyRouteIds());
          setRoutes(prev => prev.filter(r => r.id !== route.id));
          if (currentRoute && currentRoute.id === route.id) {
            setCurrentRoute(null);
          }
          alert("削除が完了しました。");
        } catch (err) {
          alert("削除に失敗しました: " + err.message);
        }
      };

      // 投稿・更新の送信処理
      const handleSubmit = async (e) => {
        e.preventDefault();
        const validSteps = newSteps.filter(s => s.bookTitle.trim() !== "");
        if (validSteps.length === 0) return;

        const stepsWithFormat = validSteps.map((s, idx) => ({
          ...s,
          _formatType: formatType
        }));

        setIsSubmitting(true);
        try {
          const entryData = {
            category: newCategory,
            title: newTitle,
            target_audience: newTarget,
            author: newAuthor.trim() || "匿名キュレーター",
            steps: stepsWithFormat
          };

          if (isEditMode) {
            const { data, error } = await supabaseClient
              .from('routes')
              .update(entryData)
              .eq('id', editingId)
              .select();

            if (error) throw error;

            if (data && data.length > 0) {
              const updated = data[0];
              setRoutes(prev => prev.map(r => r.id === editingId ? updated : r));
              if (currentRoute && currentRoute.id === editingId) {
                setCurrentRoute(updated);
              }
            }
            alert("更新しました！");
          } else {
            const { data, error } = await supabaseClient
              .from('routes')
              .insert([entryData])
              .select();

            if (error) throw error;

            if (data && data.length > 0) {
              const created = data[0];
              saveMyRouteId(created.id);
              setMyRouteIds(getMyRouteIds());
              setRoutes([created, ...routes]);
            }
            alert("投稿しました！");
          }

          setIsModalOpen(false);
        } catch (err) {
          alert("保存に失敗しました: " + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-10">
          {/* ヘッダー */}
          <header className="flex justify-between items-center mb-6 border-b border-stone-200 pb-4">
            <div>
              <h1 
                onClick={() => setCurrentRoute(null)}
                className="text-2xl font-bold tracking-tight text-stone-900 cursor-pointer hover:text-amber-950 transition font-serif"
              >
                CuratePath
              </h1>
              <p className="text-xs text-stone-500 mt-1">人文書・哲学の「テーマ別おすすめ選書 / 読む順番と接続のロジック」を共有する場</p>
            </div>
            <button 
              onClick={handleOpenCreate}
              className="bg-stone-900 hover:bg-stone-800 text-stone-50 text-xs font-semibold px-4 py-2 rounded-lg shadow-sm transition"
            >
              + 選書を投稿する
            </button>
          </header>

          {/* 💡 ガイド案内ボックス */}
          <div className="mb-6 p-4 bg-stone-200/60 border border-stone-300/80 rounded-xl text-xs text-stone-700 space-y-2 leading-relaxed">
            <div className="flex items-start gap-1.5">
              <span className="font-bold text-stone-900 shrink-0">📖 投稿スタイルについて：</span>
              <span>
                「現代思想のおすすめ3選」のような<strong>まとまりのある選書リスト（並列）</strong>はもちろん、<strong>「読む順番（順序ルート）」</strong>としても投稿できます。投稿時にスタイルを自由に選べます。
              </span>
            </div>
            <div className="flex items-start gap-1.5 pt-1 border-t border-stone-300/60">
              <span className="font-bold text-stone-900 shrink-0">⚙️ 編集・削除について：</span>
              <span>
                面倒なログインやパスワードは不要です。<strong>投稿した端末（ブラウザ）からアクセスすると、自動的に「✎ 編集」「🗑 削除」ボタンが表示されます。</strong>
              </span>
            </div>
            <div className="flex items-start gap-1.5 pt-1 border-t border-stone-300/60 text-stone-500 text-[11px]">
              <span>※ 分野の分類は目安です。お気軽に近しいカテゴリをお選びください。</span>
            </div>
          </div>

          {currentRoute ? (
            /* 詳細ビュー */
            (() => {
              const currentData = getRouteData(currentRoute);
              const isSequence = currentData.type === "sequence";

              return (
                <div>
                  <div className="flex justify-between items-center mb-6">
                    <button 
                      onClick={() => setCurrentRoute(null)}
                      className="inline-flex items-center text-xs font-semibold text-stone-600 hover:text-stone-900 bg-stone-200/70 hover:bg-stone-200 px-3 py-1.5 rounded transition"
                    >
                      ← 一覧に戻る
                    </button>

                    {myRouteIds.includes(currentRoute.id) && (
                      <div className="flex gap-2">
                        <button 
                          onClick={() => handleStartEdit(currentRoute)}
                          className="text-xs font-semibold text-stone-700 bg-white border border-stone-300 hover:bg-stone-50 px-3 py-1.5 rounded-lg shadow-sm transition"
                        >
                          ✎ 編集する
                        </button>
                        <button 
                          onClick={() => handleDelete(currentRoute)}
                          className="text-xs font-semibold text-red-600 bg-white border border-red-200 hover:bg-red-50 px-3 py-1.5 rounded-lg shadow-sm transition"
                        >
                          🗑 削除
                        </button>
                      </div>
                    )}
                  </div>

                  <div className="bg-white border border-stone-200 rounded-xl p-6 mb-8 shadow-sm">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold px-2.5 py-1 rounded bg-amber-100 text-amber-900 border border-amber-200/60">
                        {currentRoute.category}
                      </span>
                      <span className="text-xs font-medium px-2 py-0.5 rounded bg-stone-100 text-stone-600 border border-stone-200">
                        {isSequence ? "順序ルート" : "並列リスト"}
                      </span>
                    </div>
                    <h2 className="text-xl font-bold text-stone-900 mt-3 font-serif">{currentRoute.title}</h2>
                    <div className="mt-4 pt-4 border-t border-stone-100 flex flex-wrap justify-between text-xs text-stone-600 gap-2">
                      <div><span className="font-semibold text-stone-800">対象読者・テーマ:</span> {currentRoute.target_audience}</div>
                      <div><span className="font-semibold text-stone-800">キュレーター:</span> {currentRoute.author}</div>
                    </div>
                  </div>

                  <div className="space-y-6">
                    <h3 className="text-xs font-bold text-stone-400 uppercase tracking-widest px-1">
                      {isSequence ? `選書ロードマップ（全 ${currentData.items.length} 冊）` : `おすすめ選書リスト（全 ${currentData.items.length} 冊）`}
                    </h3>

                    {currentData.items.map((item, index) => (
                      <div key={index} className="relative">
                        {isSequence && index < currentData.items.length - 1 && (
                          <div className="absolute left-6 top-16 bottom-0 w-0.5 bg-stone-300 -mb-6 z-0"></div>
                        )}

                        <div className="relative z-10 bg-white border border-stone-200/90 rounded-xl p-6 shadow-sm hover:shadow transition">
                          <div className="flex items-start gap-4">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0 shadow-sm ${
                              isSequence ? "bg-stone-900 text-stone-50" : "bg-amber-100 text-amber-900 border border-amber-300"
                            }`}>
                              {isSequence ? item.step : index + 1}
                            </div>

                            <div className="flex-1 min-w-0">
                              <div className="flex flex-wrap items-baseline gap-2">
                                <h4 className="text-base font-bold text-stone-900 font-serif leading-snug">{item.bookTitle}</h4>
                                {item.author && <span className="text-xs text-stone-500">（著: {item.author}）</span>}
                              </div>

                              <div className="mt-3 bg-[#FBF9F5] p-3.5 rounded-lg border border-stone-200/70 text-xs sm:text-sm text-stone-700 leading-relaxed">
                                <span className="text-xs font-bold text-amber-900 block mb-1">
                                  {isSequence ? "【この順番にした意図・接続の理由】" : "【おすすめの理由・見どころ】"}
                                </span>
                                {item.intent}
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()
          ) : (
            /* 一覧ビュー */
            <div>
              <div className="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-stone-200">
                {INITIAL_CATEGORIES.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${
                      selectedCategory === cat 
                        ? "bg-stone-900 text-stone-50 shadow-sm" 
                        : "bg-white text-stone-600 border border-stone-200/80 hover:bg-stone-100"
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {isLoading ? (
                <div className="text-center py-12 text-xs text-stone-400">クラウドからデータを読み込み中...</div>
              ) : filteredRoutes.length === 0 ? (
                <div className="text-center py-12 text-xs text-stone-400 bg-white border border-stone-200 rounded-xl">
                  まだ選書が投稿されていません。「+ 選書を投稿する」から最初の選書を投稿してみましょう！
                </div>
              ) : (
                <div className="space-y-4">
                  {filteredRoutes.map(route => {
                    const routeData = getRouteData(route);
                    const isSequence = routeData.type === "sequence";

                    return (
                      <div 
                        key={route.id}
                        onClick={() => setCurrentRoute(route)}
                        className="bg-white hover:border-stone-300 border border-stone-200 p-5 rounded-xl shadow-sm hover:shadow transition cursor-pointer"
                      >
                        <div className="flex justify-between items-start gap-4">
                          <div>
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-amber-50 text-amber-900 border border-amber-200/60">
                                {route.category}
                              </span>
                              <span className="text-[10px] text-stone-500 bg-stone-100 px-1.5 py-0.5 rounded border border-stone-200">
                                {isSequence ? "順序ルート" : "並列リスト"}
                              </span>
                              {myRouteIds.includes(route.id) && (
                                <span className="text-[10px] bg-stone-800 text-stone-100 px-1.5 py-0.5 rounded font-medium">
                                  あなたの投稿
                                </span>
                              )}
                            </div>
                            <h2 className="text-base font-bold text-stone-900 mt-2 hover:text-amber-950 transition font-serif">
                              {route.title}
                            </h2>
                            <p className="text-xs text-stone-500 mt-1">テーマ・関心: {route.target_audience}</p>
                          </div>
                          <div className="text-right shrink-0">
                            <span className="text-[11px] text-stone-400 block">{route.author}</span>
                            <span className="text-xs font-bold text-stone-700 bg-stone-100 px-2.5 py-1 rounded-md border border-stone-200 inline-block mt-2">
                              {routeData.items.length} 冊 {isSequence ? "ルート →" : "リスト →"}
                            </span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* 投稿 / 編集モーダル */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-xl border border-stone-200">
                <div className="flex justify-between items-center border-b border-stone-200 pb-3">
                  <h3 className="font-bold text-base text-stone-900 font-serif">
                    {isEditMode ? "選書の編集" : "選書の投稿"}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-stone-400 hover:text-stone-600 text-lg">✕</button>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  {/* 形式選択（デフォルト：並列リスト） */}
                  <div>
                    <label className="block text-xs font-semibold text-stone-700 mb-1.5">投稿スタイル</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setFormatType("parallel")}
                        className={`p-2.5 rounded-lg border text-left text-xs transition ${
                          formatType === "parallel"
                            ? "border-stone-900 bg-stone-900 text-white font-bold"
                            : "border-stone-200 bg-stone-50 text-stone-600 hover:bg-stone-100"
                        }`}
                      >
                        <div className="font-semibold">並列リスト形式 (箇条書き)</div>
                        <div className={`text-[10px] mt-0.5 ${formatType === "parallel" ? "text-stone-300" : "text-stone-400"}`}>
                          おすすめ本・テーマ別コレクション
                        </div>
                      </button>

                      <button
                        type="button"
                        onClick={() => setFormatType("sequence")}
                        className={`p-2.5 rounded-lg border text-left text-xs transition ${
                          formatType === "sequence"
                            ? "border-stone-900 bg-stone-900 text-white font-bold"
                            : "border-stone-200 bg-stone-50 text-stone-600 hover:bg-stone-100"
                        }`}
                      >
                        <div className="font-semibold">順序ルート形式 (Step 1, 2...)</div>
                        <div className={`text-[10px] mt-0.5 ${formatType === "sequence" ? "text-stone-300" : "text-stone-400"}`}>
                          読む順番や接続のロジックを提示
                        </div>
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-stone-700 mb-1">分野</label>
                      <select 
                        value={newCategory} 
                        onChange={(e) => setNewCategory(e.target.value)}
                        className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs bg-white text-stone-800"
                      >
                        {INITIAL_CATEGORIES.filter(c => c !== "すべて").map(c => (
                          <option key={c} value={c}>{c}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-stone-700 mb-1">投稿者名</label>
                      <input 
                        type="text" 
                        placeholder="例: 名無しの読書子" 
                        value={newAuthor}
                        onChange={(e) => setNewAuthor(e.target.value)}
                        className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs text-stone-800"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-stone-700 mb-1">タイトル</label>
                    <input 
                      type="text" 
                      required
                      placeholder={formatType === "parallel" ? "例: 現代思想を始めるためのおすすめ3選" : "例: 主観と認識の限界をめぐる基礎ルート"} 
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs text-stone-800"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-stone-700 mb-1">想定読者・テーマ・関心</label>
                    <input 
                      type="text" 
                      required
                      placeholder="例: ポスト構造主義の主要な概念に触れてみたい人" 
                      value={newTarget}
                      onChange={(e) => setNewTarget(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs text-stone-800"
                    />
                  </div>

                  <div className="space-y-4 pt-2">
                    <label className="block text-xs font-bold text-stone-900 uppercase">
                      {formatType === "parallel" ? "おすすめ書籍一覧" : "読む順番と意図"}
                    </label>

                    {newSteps.map((step, idx) => (
                      <div key={idx} className="p-4 bg-[#FBF9F5] border border-stone-200 rounded-lg space-y-3 relative">
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-xs text-amber-900">
                            {formatType === "parallel" ? `Book ${idx + 1}` : `Step ${step.step}`}
                          </span>
                          {newSteps.length > 1 && (
                            <button 
                              type="button" 
                              onClick={() => handleRemoveStep(idx)}
                              className="text-[11px] text-red-500 hover:text-red-700"
                            >
                              削除
                            </button>
                          )}
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="block text-[11px] text-stone-600 mb-0.5">本のタイトル *</label>
                            <input 
                              type="text" 
                              required
                              placeholder="例: 方法序説" 
                              value={step.bookTitle}
                              onChange={(e) => handleStepChange(idx, "bookTitle", e.target.value)}
                              className="w-full border border-stone-300 rounded-md px-2.5 py-1.5 text-xs bg-white text-stone-800"
                            />
                          </div>
                          <div>
                            <label className="block text-[11px] text-stone-600 mb-0.5">著者名</label>
                            <input 
                              type="text" 
                              placeholder="例: ルネ・デカルト" 
                              value={step.author}
                              onChange={(e) => handleStepChange(idx, "author", e.target.value)}
                              className="w-full border border-stone-300 rounded-md px-2.5 py-1.5 text-xs bg-white text-stone-800"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-[11px] text-stone-600 mb-0.5">
                            {formatType === "parallel" ? "おすすめの理由・見どころ *" : "なぜこの順番なのか？（接続の理由） *"}
                          </label>
                          <textarea 
                            rows="2"
                            required
                            placeholder={formatType === "parallel" 
                              ? "例: 現代思想の脱構築を学ぶ上で最も鮮烈な視点を提供してくれるため。" 
                              : "例: 1冊目の主観の出発点を踏まえ、理性の限界を規定する2冊目へ接続するため。"}
                            value={step.intent}
                            onChange={(e) => handleStepChange(idx, "intent", e.target.value)}
                            className="w-full border border-stone-300 rounded-md px-2.5 py-1.5 text-xs bg-white text-stone-800"
                          />
                        </div>
                      </div>
                    ))}

                    <button 
                      type="button" 
                      onClick={handleAddStep}
                      className="text-xs text-stone-700 hover:text-stone-900 font-semibold"
                    >
                      + 本を追加する
                    </button>
                  </div>

                  <div className="flex justify-end gap-2 pt-4 border-t border-stone-200">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 border border-stone-300 rounded-lg text-xs text-stone-600 hover:bg-stone-50"
                    >
                      キャンセル
                    </button>
                    <button 
                      type="submit"
                      disabled={isSubmitting}
                      className="px-4 py-2 bg-stone-900 text-stone-50 rounded-lg text-xs font-semibold hover:bg-stone-800 shadow-sm disabled:opacity-50"
                    >
                      {isSubmitting ? "保存中..." : isEditMode ? "変更を保存する" : "投稿する"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
