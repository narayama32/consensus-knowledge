<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuratePath - 学問の選書ロードマップ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React, ReactDOM, Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FBF9F5] text-stone-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const INITIAL_CATEGORIES = ["すべて", "経済学", "現代思想", "社会学", "政治学", "科学哲学"];

    const INITIAL_ROUTES = [
      {
        id: 1,
        category: "現代思想",
        title: "消費社会のリアリティを解読するルート",
        targetAudience: "記号消費や現代カルチャーの構造を理論的に分析したい人",
        author: "T. Nakamura",
        steps: [
          {
            step: 1,
            bookTitle: "消費社会の神話と構造",
            author: "ジャン・ボードリヤール",
            coverUrl: "https://cover.openbd.jp/9784326100742.jpg",
            intent: "モノではなく「差異の記号」を消費しているという現代社会の基本構造を掴むための必読原典。"
          },
          {
            step: 2,
            bookTitle: "動物化するポストモダン",
            author: "東浩紀",
            coverUrl: "https://cover.openbd.jp/9784061495753.jpg",
            intent: "ボードリヤール的な記号消費モデルがオタクカルチャーや情報環境でどう変容したかを接続して理解する。"
          }
        ]
      }
    ];

    function App() {
      const [routes, setRoutes] = useState(INITIAL_ROUTES);
      const [selectedCategory, setSelectedCategory] = useState("すべて");
      const [currentRoute, setCurrentRoute] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const [newCategory, setNewCategory] = useState("現代思想");
      const [newTitle, setNewTitle] = useState("");
      const [newTarget, setNewTarget] = useState("");
      const [newAuthor, setNewAuthor] = useState("");
      const [newSteps, setNewSteps] = useState([
        { step: 1, bookTitle: "", author: "", coverUrl: "", intent: "", searchQuery: "", isSearching: false, searchResults: [], searchMessage: "" },
        { step: 2, bookTitle: "", author: "", coverUrl: "", intent: "", searchQuery: "", isSearching: false, searchResults: [], searchMessage: "" }
      ]);

      const filteredRoutes = selectedCategory === "すべて" 
        ? routes 
        : routes.filter(r => r.category === selectedCategory);

      // 国会図書館サーチ (NDL) API を使った完全CORSフリー検索
      const handleSearchBook = async (idx) => {
        const query = newSteps[idx].searchQuery.trim();
        if (!query) return;

        setNewSteps(prev => prev.map((s, i) => i === idx ? { 
          ...s, 
          isSearching: true, 
          searchResults: [], 
          searchMessage: "" 
        } : s));

        try {
          // 国立国会図書館サーチ OpenSearch API
          const targetUrl = `https://ndlsearch.ndl.go.jp/api/opensearch?title=${encodeURIComponent(query)}&cnt=6`;
          const res = await fetch(targetUrl);
          
          if (!res.ok) throw new Error("NDL API Error");

          const xmlText = await res.text();
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, "text/xml");
          const items = xmlDoc.getElementsByTagName("item");

          if (!items || items.length === 0) {
            setNewSteps(prev => prev.map((s, i) => i === idx ? { 
              ...s, 
              isSearching: false, 
              searchResults: [], 
              searchMessage: "該当する書籍が見つかりませんでした。直接手入力してください。" 
            } : s));
            return;
          }

          const parsedResults = [];
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            const titleElem = item.getElementsByTagName("title")[0];
            const authorElem = item.getElementsByTagName("author")[0];
            const isbnElem = item.getElementsByTagName("identifier")[0];

            const title = titleElem ? titleElem.textContent : query;
            const author = authorElem ? authorElem.textContent : "著者不明";
            
            // ISBNがあればopenBDから高画質な書影を取得
            let isbn = "";
            if (isbnElem && isbnElem.textContent) {
              const match = isbnElem.textContent.match(/\d{13}|\d{10}/);
              if (match) isbn = match[0];
            }
            const coverUrl = isbn ? `https://cover.openbd.jp/${isbn}.jpg` : "";

            parsedResults.push({ title, author, coverUrl });
          }

          setNewSteps(prev => prev.map((s, i) => i === idx ? { 
            ...s, 
            isSearching: false, 
            searchResults: parsedResults, 
            searchMessage: "" 
          } : s));

        } catch (error) {
          console.warn("API Error:", error);
          setNewSteps(prev => prev.map((s, i) => i === idx ? { 
            ...s, 
            isSearching: false, 
            bookTitle: query,
            searchResults: [], 
            searchMessage: `通信に失敗したため「${query}」をタイトル欄に代入しました。` 
          } : s));
        }
      };

      const handleSelectBook = (stepIdx, book) => {
        setNewSteps(prev => prev.map((s, i) => i === stepIdx ? {
          ...s,
          bookTitle: book.title,
          author: book.author,
          coverUrl: book.coverUrl,
          searchResults: [],
          searchQuery: "",
          searchMessage: ""
        } : s));
      };

      const handleAddStep = () => {
        setNewSteps(prev => [
          ...prev, 
          { 
            step: prev.length + 1, 
            bookTitle: "", 
            author: "", 
            coverUrl: "", 
            intent: "", 
            searchQuery: "", 
            isSearching: false, 
            searchResults: [],
            searchMessage: ""
          }
        ]);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const newEntry = {
          id: Date.now(),
          category: newCategory,
          title: newTitle,
          targetAudience: newTarget,
          author: newAuthor || "匿名キュレーター",
          steps: newSteps.filter(s => s.bookTitle.trim() !== "")
        };
        setRoutes([newEntry, ...routes]);
        setIsModalOpen(false);
        setNewTitle("");
        setNewTarget("");
        setNewAuthor("");
        setNewSteps([
          { step: 1, bookTitle: "", author: "", coverUrl: "", intent: "", searchQuery: "", isSearching: false, searchResults: [], searchMessage: "" },
          { step: 2, bookTitle: "", author: "", coverUrl: "", intent: "", searchQuery: "", isSearching: false, searchResults: [], searchMessage: "" }
        ]);
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-10">
          <header className="flex justify-between items-center mb-8 border-b border-stone-200 pb-4">
            <div>
              <h1 
                onClick={() => setCurrentRoute(null)}
                className="text-2xl font-bold tracking-tight text-stone-900 cursor-pointer hover:text-amber-950 transition font-serif"
              >
                CuratePath
              </h1>
              <p className="text-xs text-stone-500 mt-1">学問の「読む順番と意図」を共有・比較するプラットフォーム</p>
            </div>
            <button 
              onClick={() => setIsModalOpen(true)}
              className="bg-stone-900 hover:bg-stone-800 text-stone-50 text-xs font-semibold px-4 py-2 rounded-lg shadow-sm transition"
            >
              + ルートを投稿する
            </button>
          </header>

          {currentRoute ? (
            <div>
              <button 
                onClick={() => setCurrentRoute(null)}
                className="inline-flex items-center text-xs font-semibold text-stone-600 hover:text-stone-900 mb-6 bg-stone-200/70 hover:bg-stone-200 px-3 py-1.5 rounded transition"
              >
                ← 一覧に戻る
              </button>

              <div className="bg-white border border-stone-200 rounded-xl p-6 mb-8 shadow-sm">
                <span className="text-xs font-bold px-2.5 py-1 rounded bg-amber-100 text-amber-900 border border-amber-200/60">
                  {currentRoute.category}
                </span>
                <h2 className="text-xl font-bold text-stone-900 mt-3 font-serif">{currentRoute.title}</h2>
                <div className="mt-4 pt-4 border-t border-stone-100 flex flex-wrap justify-between text-xs text-stone-600 gap-2">
                  <div><span className="font-semibold text-stone-800">対象読者:</span> {currentRoute.targetAudience}</div>
                  <div><span className="font-semibold text-stone-800">作成者:</span> {currentRoute.author}</div>
                </div>
              </div>

              <div className="space-y-6">
                <h3 className="text-xs font-bold text-stone-400 uppercase tracking-widest px-1">
                  学習ルート（全 {currentRoute.steps.length} 冊）
                </h3>

                {currentRoute.steps.map((item, index) => (
                  <div key={index} className="relative">
                    {index < currentRoute.steps.length - 1 && (
                      <div className="absolute left-6 top-16 bottom-0 w-0.5 bg-stone-300 -mb-6 z-0"></div>
                    )}

                    <div className="relative z-10 bg-white border border-stone-200/90 rounded-xl p-6 shadow-sm hover:shadow transition">
                      <div className="flex items-start gap-4">
                        <div className="w-8 h-8 rounded-full bg-stone-900 text-stone-50 flex items-center justify-center font-bold text-sm shrink-0 shadow-sm">
                          {item.step}
                        </div>

                        {item.coverUrl ? (
                          <img 
                            src={item.coverUrl} 
                            alt={item.bookTitle} 
                            className="w-16 h-24 object-cover rounded shadow-sm border border-stone-200 shrink-0 bg-stone-100"
                            onError={(e) => { e.target.style.display = 'none'; }}
                          />
                        ) : (
                          <div className="w-16 h-24 bg-stone-100 border border-stone-200 rounded flex items-center justify-center text-[10px] text-stone-400 text-center px-1 shrink-0">
                            No Image
                          </div>
                        )}

                        <div className="flex-1 min-w-0">
                          <h4 className="text-base font-bold text-stone-900 font-serif leading-snug">{item.bookTitle}</h4>
                          <span className="text-xs text-stone-500 block mt-0.5">著: {item.author}</span>

                          <div className="mt-3 bg-[#FBF9F5] p-3.5 rounded-lg border border-stone-200/70 text-xs sm:text-sm text-stone-700 leading-relaxed">
                            <span className="text-xs font-bold text-amber-900 block mb-1">【この順番にした意図・接続】</span>
                            {item.intent}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div>
              <div className="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-stone-200">
                {INITIAL_CATEGORIES.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${
                      selectedCategory === cat 
                        ? "bg-stone-900 text-stone-50 shadow-sm" 
                        : "bg-white text-stone-600 border border-stone-200/80 hover:bg-stone-100"
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div className="space-y-4">
                {filteredRoutes.map(route => (
                  <div 
                    key={route.id}
                    onClick={() => setCurrentRoute(route)}
                    className="bg-white hover:border-stone-300 border border-stone-200 p-5 rounded-xl shadow-sm hover:shadow transition cursor-pointer"
                  >
                    <div className="flex justify-between items-start gap-4">
                      <div>
                        <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-amber-50 text-amber-900 border border-amber-200/60">
                          {route.category}
                        </span>
                        <h2 className="text-base font-bold text-stone-900 mt-2 hover:text-amber-950 transition font-serif">
                          {route.title}
                        </h2>
                        <p className="text-xs text-stone-500 mt-1">対象: {route.targetAudience}</p>
                      </div>
                      <div className="text-right shrink-0">
                        <span className="text-[11px] text-stone-400 block">{route.author}</span>
                        <span className="text-xs font-bold text-stone-700 bg-stone-100 px-2.5 py-1 rounded-md border border-stone-200 inline-block mt-2">
                          {route.steps.length} 冊ルート →
                        </span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {isModalOpen && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-xl border border-stone-200">
                <div className="flex justify-between items-center border-b border-stone-200 pb-3">
                  <h3 className="font-bold text-base text-stone-900 font-serif">選書ルートの投稿</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-stone-400 hover:text-stone-600 text-lg">✕</button>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-stone-700 mb-1">分野</label>
                      <select 
                        value={newCategory} 
                        onChange={(e) => setNewCategory(e.target.value)}
                        className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs bg-white text-stone-800"
                      >
                        {INITIAL_CATEGORIES.filter(c => c !== "すべて").map(c => (
                          <option key={c} value={c}>{c}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-stone-700 mb-1">投稿者名</label>
                      <input 
                        type="text" 
                        placeholder="例: 名無しの読書子" 
                        value={newAuthor}
                        onChange={(e) => setNewAuthor(e.target.value)}
                        className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs text-stone-800"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-stone-700 mb-1">ルートのタイトル</label>
                    <input 
                      type="text" 
                      required
                      placeholder="例: 記号消費から読み解くポストモダン思想" 
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs text-stone-800"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-stone-700 mb-1">想定読者・ゴール</label>
                    <input 
                      type="text" 
                      required
                      placeholder="例: 現代思想・カルチャー批判の足がかりを掴みたい人向け" 
                      value={newTarget}
                      onChange={(e) => setNewTarget(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs text-stone-800"
                    />
                  </div>

                  <div className="space-y-4 pt-2">
                    <label className="block text-xs font-bold text-stone-900 uppercase">読む順番と意図</label>
                    {newSteps.map((step, idx) => (
                      <div key={idx} className="p-4 bg-[#FBF9F5] border border-stone-200 rounded-lg space-y-3">
                        <div className="font-bold text-xs text-amber-900">Step {idx + 1}</div>

                        <div className="space-y-1">
                          <label className="block text-[11px] font-medium text-stone-600">書籍を検索（国会図書館DB直接検索）</label>
                          <div className="flex gap-2">
                            <input 
                              type="text" 
                              placeholder="タイトルを入力（例: 消費社会の神話と構造）" 
                              value={step.searchQuery}
                              onChange={(e) => {
                                const val = e.target.value;
                                setNewSteps(prev => prev.map((s, i) => i === idx ? { ...s, searchQuery: val } : s));
                              }}
                              onKeyDown={(e) => {
                                if (e.key === 'Enter') {
                                  e.preventDefault();
                                  handleSearchBook(idx);
                                }
                              }}
                              className="flex-1 border border-stone-300 rounded-md px-2.5 py-1.5 text-xs bg-white text-stone-800"
                            />
                            <button 
                              type="button" 
                              onClick={() => handleSearchBook(idx)}
                              disabled={step.isSearching}
                              className="bg-stone-800 hover:bg-stone-700 text-white px-3 py-1.5 rounded-md text-xs font-medium shrink-0 disabled:opacity-50"
                            >
                              {step.isSearching ? "検索中..." : "検索"}
                            </button>
                          </div>

                          {step.searchMessage && (
                            <div className="text-[11px] text-amber-800 bg-amber-50 border border-amber-200/60 p-2 rounded mt-1">
                              {step.searchMessage}
                            </div>
                          )}

                          {step.searchResults.length > 0 && (
                            <div className="bg-white border border-stone-300 rounded-md shadow-lg mt-1 p-2 space-y-1.5 max-h-48 overflow-y-auto">
                              <span className="text-[10px] text-stone-400 block px-1">候補を選択してください：</span>
                              {step.searchResults.map((book, bIdx) => (
                                <div 
                                  key={bIdx}
                                  onClick={() => handleSelectBook(idx, book)}
                                  className="flex items-center gap-2.5 p-1.5 hover:bg-stone-100 rounded cursor-pointer transition text-left"
                                >
                                  {book.coverUrl ? (
                                    <img src={book.coverUrl} alt="" className="w-8 h-10 object-cover rounded border border-stone-200 shrink-0 bg-stone-50" onError={(e) => { e.target.style.display = 'none'; }} />
                                  ) : (
                                    <div className="w-8 h-10 bg-stone-100 border border-stone-200 rounded flex items-center justify-center text-[8px] text-stone-400 shrink-0">書籍</div>
                                  )}
                                  <div className="min-w-0 flex-1">
                                    <div className="text-xs font-bold text-stone-800 truncate">{book.title}</div>
                                    <div className="text-[11px] text-stone-500 truncate">{book.author}</div>
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>

                        <div className="grid grid-cols-2 gap-2 pt-1">
                          <input 
                            type="text" 
                            required
                            placeholder="本のタイトル" 
                            value={step.bookTitle}
                            onChange={(e) => {
                              const val = e.target.value;
                              setNewSteps(prev => prev.map((s, i) => i === idx ? { ...s, bookTitle: val } : s));
                            }}
                            className="border border-stone-300 rounded-md px-2.5 py-1.5 text-xs bg-white text-stone-800"
                          />
                          <input 
                            type="text" 
                            placeholder="著者名" 
                            value={step.author}
                            onChange={(e) => {
                              const val = e.target.value;
                              setNewSteps(prev => prev.map((s, i) => i === idx ? { ...s, author: val } : s));
                            }}
                            className="border border-stone-300 rounded-md px-2.5 py-1.5 text-xs bg-white text-stone-800"
                          />
                        </div>

                        <textarea 
                          rows="2"
                          required
                          placeholder="なぜこの順番なのか？（1冊目を受けてどう読むかなど）"
                          value={step.intent}
                          onChange={(e) => {
                            const val = e.target.value;
                            setNewSteps(prev => prev.map((s, i) => i === idx ? { ...s, intent: val } : s));
                          }}
                          className="w-full border border-stone-300 rounded-md px-2.5 py-1.5 text-xs bg-white text-stone-800"
                        />
                      </div>
                    ))}

                    <button 
                      type="button" 
                      onClick={handleAddStep}
                      className="text-xs text-stone-700 hover:text-stone-900 font-semibold"
                    >
                      + ステップを追加する
                    </button>
                  </div>

                  <div className="flex justify-end gap-2 pt-4 border-t border-stone-200">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 border border-stone-300 rounded-lg text-xs text-stone-600 hover:bg-stone-50"
                    >
                      キャンセル
                    </button>
                    <button 
                      type="submit"
                      className="px-4 py-2 bg-stone-900 text-stone-50 rounded-lg text-xs font-semibold hover:bg-stone-800 shadow-sm"
                    >
                      投稿する
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
